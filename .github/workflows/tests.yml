name: tests
on:
  push:
  pull_request:
jobs:
  test-ai-setup:
    name: Test AI Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck (free, from Ubuntu repos)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Shellcheck every script under files/ and tests/
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r script; do
            # Shell scripts only (Find Anything's engine is Python: tests/test-find-extras.sh checks it).
            if head -n 1 -- "$script" | grep -Eq '^#!.*(bash|/sh)'; then
              echo "shellcheck -S warning $script"
              shellcheck -S warning "$script"
              found=$((found + 1))
            fi
          done < <(find files tests -type f | sort)
          if (( found == 0 )); then
            echo "ERROR: no scripts found under files/ or tests/" >&2
            exit 1
          fi

      - name: Run forgeos-ai-setup dry-run tests
        run: bash tests/test-ai-setup.sh

      - name: Check default Flatpak app list
        run: bash tests/test-flatpak-list.sh

      - name: Check both images (forgeos + forgeos-nvidia) share one module list
        run: bash tests/test-recipes.sh .

      - name: Check Cool Stuff menu buttons and KDE Connect
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-cool-stuff.sh

      - name: Run Clean Sweep tests (fake tools)
        run: bash tests/test-clean-sweep.sh .

      - name: Run Clean Sweep test O with real ClamAV (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends clamav
          REAL_CLAMAV=1 bash tests/test-clean-sweep.sh .

      - name: Run Undo Button tests (fake tools)
        run: |
          bash tests/test-undo.sh .
          bash tests/test-undo-extras.sh .

      - name: Run Undo Button tests on a real btrfs disk with real snapper (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends snapper btrfs-progs
          sudo bash tests/test-undo-real.sh .

      - name: Run Panic Button tests (fake tools)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils libxml2-utils
          bash tests/test-panic.sh .

      - name: Run Privacy Report tests (fake tools)
        run: bash tests/test-privacy.sh .

      - name: Run Scam Shield tests (fake tools)
        run: |
          bash tests/test-scamshield.sh .
          bash tests/test-scamshield-extras.sh .

      - name: Run Ask Your PC tests (fake tools)
        run: |
          bash tests/test-askpc.sh .
          bash tests/test-askpc-extras.sh .

      - name: Run Will It Run? tests (fake tools)
        run: |
          bash tests/test-willitrun.sh .
          bash tests/test-willitrun-games.sh .
          bash tests/test-willitrun-open.sh .
          bash tests/test-willitrun-extras.sh .
          bash tests/test-willitrun-safety.sh .

      - name: Run Find Anything tests (fake tools)
        run: |
          bash tests/test-find.sh .
          bash tests/test-find-ask.sh .
          bash tests/test-find-extras.sh .

      - name: Run Find Anything test U with real OCR and PDF tools (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils
          bash tests/test-find-real.sh .

      - name: Run GhostFinder tests (fake tools, real sockets on 127.0.0.x)
        run: |
          bash tests/test-ghost.sh .
          bash tests/test-ghost-safe.sh .
          bash tests/test-ghost-watch.sh .
          bash tests/test-ghost-gui.sh .
          bash tests/test-ghost-files.sh .

      - name: Run GhostFinder tests U-V with real D-Bus and a fake BlueZ (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends dbus python3-dbus python3-gi
          GHOST_PY=/usr/bin/python3 bash tests/test-ghost-real.sh .

      - name: Run Family Mode tests (fake tools)
        run: |
          bash tests/test-family.sh .
          bash tests/test-family-more.sh .
          bash tests/test-family-rustdesk.sh .
          bash tests/test-family-call.sh .
          bash tests/test-family-gui.sh .
          bash tests/test-family-files.sh .

      - name: Run Always-On Guard tests (real ClamAV + clamd with a test-only signature, free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends clamav clamav-daemon clamdscan desktop-file-utils
          bash tests/test-guard.sh .
          bash tests/test-guard-more.sh .
          bash tests/test-guard-watch.sh .
          bash tests/test-guard-mail.sh .
          bash tests/test-guard-inbox.sh .
          bash tests/test-guard-hosts.sh .
          bash tests/test-guard-gui.sh .
          bash tests/test-guard-files.sh .

      - name: Run Forge Helper tests (fake tools, fake AI on 127.0.0.1, real D-Bus for KDE search, free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends python3-dbus python3-gi dbus dbus-x11 desktop-file-utils
          bash tests/test-helper.sh .
          bash tests/test-helper-ai.sh .
          bash tests/test-helper-brains.sh .
          bash tests/test-helper-do.sh .
          bash tests/test-helper-watch.sh .
          bash tests/test-helper-gui.sh .
          FORGEOS_TEST_PY=/usr/bin/python3 bash tests/test-helper-krunner.sh .
          bash tests/test-helper-files.sh .

      - name: Run Driver & BIOS Autopilot tests (fake PC, fake fwupd and rpm-ostree, free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-autopilot.sh .
          bash tests/test-autopilot-devices.sh .
          bash tests/test-autopilot-boot.sh .
          bash tests/test-autopilot-fw.sh .
          bash tests/test-autopilot-bios.sh .
          bash tests/test-autopilot-notes.sh .
          bash tests/test-autopilot-gui.sh .
          bash tests/test-autopilot-files.sh .

      - name: Run Install & Switch tests (fake start-up list and Windows drives; PowerShell runs the Windows script)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils python3-yaml
          bash tests/test-switch.sh .
          bash tests/test-switch-win.sh .
          bash tests/test-switch-gui.sh .
          bash tests/test-switch-files.sh .

      - name: Run Moving Day tests (fake Windows drives, BitLocker and Brave; PowerShell runs the Pack my old PC script)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-movingday.sh .
          bash tests/test-movingday-move.sh .
          bash tests/test-movingday-more.sh .
          bash tests/test-movingday-win.sh .
          bash tests/test-movingday-gui.sh .
          bash tests/test-movingday-files.sh .

      - name: Run Drive Death Warning tests (fake drives, smartctl and btrfs; real Ask Your PC + Forge Helper code)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-drivehealth.sh .
          bash tests/test-drivehealth-danger.sh .
          bash tests/test-drivehealth-more.sh .
          bash tests/test-drivehealth-tick.sh .
          bash tests/test-drivehealth-gui.sh .
          bash tests/test-drivehealth-files.sh .

      - name: Run Ransomware Tripwire tests (pretend programs, apps and snapshots; then the REAL kernel watcher with sudo)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-tripwire.sh .
          bash tests/test-tripwire-more.sh .
          bash tests/test-tripwire-bait.sh .
          bash tests/test-tripwire-restore.sh .
          bash tests/test-tripwire-actions.sh .
          bash tests/test-tripwire-gui.sh .
          bash tests/test-tripwire-kernel.sh .
          bash tests/test-tripwire-files.sh .

      - name: Run Fake Tech Support Guard tests (pretend remote apps, screen sharing and hosts file; a real pretend app)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-techguard.sh .
          bash tests/test-techguard-more.sh .
          bash tests/test-techguard-money.sh .
          bash tests/test-techguard-kick.sh .
          bash tests/test-techguard-gui.sh .
          bash tests/test-techguard-files.sh .

      - name: Run Digital Will tests (real 7-Zip locks and opens the envelope; a real locked test drive with sudo cryptsetup)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils 7zip cryptsetup-bin
          bash tests/test-digitalwill.sh .
          bash tests/test-digitalwill-make.sh .
          bash tests/test-digitalwill-more.sh .
          bash tests/test-digitalwill-unlock.sh .
          bash tests/test-digitalwill-remind.sh .
          bash tests/test-digitalwill-gui.sh .
          bash tests/test-digitalwill-files.sh .

      - name: Run Find My PC tests (a pretend relay on this runner; the real AES-256-GCM lock in Python and in Node.js)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils python3-cryptography
          bash tests/test-locate.sh .
          bash tests/test-locate-watch.sh .
          bash tests/test-locate-commands.sh .
          bash tests/test-locate-alert.sh .
          bash tests/test-locate-gui.sh .
          bash tests/test-locate-page.sh .
          bash tests/test-locate-files.sh .
