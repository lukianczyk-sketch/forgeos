name: tests
on:
  push:
  pull_request:
jobs:
  test-ai-setup:
    name: Test AI Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck (free, from Ubuntu repos)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Shellcheck every script under files/ and tests/
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r script; do
            # Shell scripts only (Find Anything's engine is Python: tests/test-find-extras.sh checks it).
            if head -n 1 -- "$script" | grep -Eq '^#!.*(bash|/sh)'; then
              echo "shellcheck -S warning $script"
              shellcheck -S warning "$script"
              found=$((found + 1))
            fi
          done < <(find files tests -type f | sort)
          if (( found == 0 )); then
            echo "ERROR: no scripts found under files/ or tests/" >&2
            exit 1
          fi

      - name: Run forgeos-ai-setup dry-run tests
        run: bash tests/test-ai-setup.sh

      - name: Check default Flatpak app list
        run: bash tests/test-flatpak-list.sh

      - name: Check both images (forgeos + forgeos-nvidia) share one module list
        run: bash tests/test-recipes.sh .

      - name: Check Cool Stuff menu buttons and KDE Connect
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash tests/test-cool-stuff.sh

      - name: Run Clean Sweep tests (fake tools)
        run: bash tests/test-clean-sweep.sh .

      - name: Run Clean Sweep test O with real ClamAV (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends clamav
          REAL_CLAMAV=1 bash tests/test-clean-sweep.sh .

      - name: Run Undo Button tests (fake tools)
        run: |
          bash tests/test-undo.sh .
          bash tests/test-undo-extras.sh .

      - name: Run Undo Button tests on a real btrfs disk with real snapper (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends snapper btrfs-progs
          sudo bash tests/test-undo-real.sh .

      - name: Run Panic Button tests (fake tools)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils libxml2-utils
          bash tests/test-panic.sh .

      - name: Run Privacy Report tests (fake tools)
        run: bash tests/test-privacy.sh .

      - name: Run Scam Shield tests (fake tools)
        run: |
          bash tests/test-scamshield.sh .
          bash tests/test-scamshield-extras.sh .

      - name: Run Ask Your PC tests (fake tools)
        run: |
          bash tests/test-askpc.sh .
          bash tests/test-askpc-extras.sh .

      - name: Run Will It Run? tests (fake tools)
        run: |
          bash tests/test-willitrun.sh .
          bash tests/test-willitrun-games.sh .
          bash tests/test-willitrun-open.sh .
          bash tests/test-willitrun-extras.sh .
          bash tests/test-willitrun-safety.sh .

      - name: Run Find Anything tests (fake tools)
        run: |
          bash tests/test-find.sh .
          bash tests/test-find-ask.sh .
          bash tests/test-find-extras.sh .

      - name: Run Find Anything test U with real OCR and PDF tools (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils
          bash tests/test-find-real.sh .

      - name: Run GhostFinder tests (fake tools, real sockets on 127.0.0.x)
        run: |
          bash tests/test-ghost.sh .
          bash tests/test-ghost-safe.sh .
          bash tests/test-ghost-watch.sh .
          bash tests/test-ghost-gui.sh .
          bash tests/test-ghost-files.sh .

      - name: Run GhostFinder tests U-V with real D-Bus and a fake BlueZ (free, from Ubuntu repos)
        run: |
          sudo apt-get install -y --no-install-recommends dbus python3-dbus python3-gi
          GHOST_PY=/usr/bin/python3 bash tests/test-ghost-real.sh .
