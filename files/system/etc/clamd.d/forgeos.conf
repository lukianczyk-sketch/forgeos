# ForgeOS Always-On Guard (Job 13b): settings for the always-ready virus checker (forgeos-clamd.service).
# Files are streamed to it (clamdscan --stream), so it never needs to open your files.
LocalSocket /run/clamd.forgeos/clamd.sock
LocalSocketMode 666
DatabaseDirectory /var/lib/clamav
Foreground yes
LogSyslog yes
LogTime yes
# Check for new virus lists every 10 minutes. Load them without a second copy in memory
# (saves about 1.2 GB; checks wait a few seconds during the daily reload).
SelfCheck 600
ConcurrentDatabaseReload no
StreamMaxLength 400M
MaxFileSize 400M
MaxScanSize 1000M
MaxThreads 4
